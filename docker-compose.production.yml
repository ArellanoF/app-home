services:
  app:
    image: ${APP_IMAGE:-vestapp-production}
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment: &app-environment
      APP_NAME: ${APP_NAME:-Vestapp}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-vestapp}
      DB_USERNAME: ${DB_USERNAME:-vestapp}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      QUEUE_CONNECTION: sync
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Vestapp}
      HOUSE_NAME: ${HOUSE_NAME:-Mi hogar}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEATHER_LOCATION: ${WEATHER_LOCATION:-}
      GOOGLE_CALENDAR_PUBLIC_URL: ${GOOGLE_CALENDAR_PUBLIC_URL:-}
      GOOGLE_CALENDAR_ICAL_URL: ${GOOGLE_CALENDAR_ICAL_URL:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:?WEB_PUSH_SUBJECT is required}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:?WEB_PUSH_PUBLIC_KEY is required}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:?WEB_PUSH_PRIVATE_KEY is required}
      RUN_MIGRATIONS: "true"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - vestapp

  scheduler:
    image: ${APP_IMAGE:-vestapp-production}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - vestapp

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-vestapp}
      MARIADB_USER: ${DB_USERNAME:-vestapp}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - vestapp

volumes:
  mariadb_data:

networks:
  vestapp:
